{% extends "base.html" %}


{% block content %}
    <div class="container mt-4">
        <h1>Asset Management Dashboard</h1>

        <!-- Add these buttons to the existing dashboard -->
        <div class="mt-4">
            <div class="d-grid gap-2 d-md-flex">
                <a href="{% url 'assets:add_room_asset' %}" class="btn btn-success me-md-2">Add Asset to Room</a>
                <a href="{% url 'assets:room_assets_list' %}" class="btn btn-info me-md-2">View All Room Assets</a>
                <a href="{% url 'assets:monthly_audits' %}" class="btn btn-warning me-md-2">Monthly Audits</a>
                <a href="{% url 'assets:maintenance_list' %}" class="btn btn-secondary">Maintenance History</a>
            </div>
        </div>
                
        <div class="row mt-4">
            <div class="col-md-4">
                <div class="card text-white bg-primary">
                    <div class="card-body">
                        <h5 class="card-title">Total Assets</h5>
                        <h2>{{ total_assets }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-warning">
                    <div class="card-body">
                        <h5 class="card-title">Need Maintenance</h5>
                        <h2>{{ assets_needing_maintenance }}</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-info">
                    <div class="card-body">
                        <h5 class="card-title">Pending Audits</h5>
                        <h2>{{ pending_audits }}</h2>
                    </div>
                </div>
            </div>
        </div>
        

    </div>
{% endblock %}
